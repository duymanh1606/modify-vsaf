# .bmm-config.yaml — CODE REPO config (auto-generated by bootstrap script)
#
# Generated for: {{CODE_REPO_NAME}}
# Generated at: {{TIMESTAMP}}
#
# Edit này nếu cần override paths hoặc thêm skill-specific config.
# Skill canonical ở .agent/skills/ (symlink → meta hoặc spec repo).

project_name: {{PROJECT_NAME}}

bmad:
  spec_repo_root: {{SPEC_REPO_RELATIVE}}
  code_repo_root: .
  # DS root CỦA REPO NÀY. Single-DS: family root (design-system/). Multi-DS (nhiều
  # FE repo): trỏ {family}/{ds_id} theo registry.yaml — xem spec repo
  # NTAPP-output/design-system/_shared/ds-registry-schema.md + ds-resolution.md (nhánh A).
  design_system_root: {{DS_ROOT}}
  meta_repo_root: {{META_REPO_RELATIVE}}

stack:
  language: {{LANG}}
  framework: {{FRAMEWORK}}
  ui_library: {{UI_LIB}}
  build_tool: {{BUILD_TOOL}}

# ─── Pre-commit UI-file detection (Rule 1/4/6/9) ────────────────────
# Mặc định hook coi UI file theo ĐUÔI: .tsx/.jsx/.vue/.html/.css/.scss/...
# Framework để UI component trong `.ts` thuần (Angular `*.component.ts`) sẽ bị
# coi là non-UI → header `SCR-*`/`WGT-*` fail Rule 1. Khai báo regex bên dưới
# (match theo path) để hook nhận diện đúng là UI. Bỏ comment khi cần:
# ui_file_pattern: "\\.(component|page)\\.ts$"

# ─── Per-skill output path overrides ────────────────────────────────
# Stage 5 skill chạy ở code repo ghi artifact theo paths này.

bmad-testarch-framework:
  test_artifacts: "{project-root}/NTAPP-output/test-artifacts"

bmad-testarch-atdd:
  test_artifacts: "{project-root}/NTAPP-output/test-artifacts"
  tests_output: "{project-root}/tests"
