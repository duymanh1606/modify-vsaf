# =============================================================================
# .bmm-config.yaml — NTAPP/BMAD config cho repo
# =============================================================================
# Copy file này về repo root của FE project, rename thành `.bmm-config.yaml`.
# Tất cả field optional (skill có default). Override chỉ những field bạn cần.
#
# Document layout:
#   - bmad.*               — global paths cho NTAPP/BMAD ecosystem
#   - stack.*              — manual override stack-detector
#   - ds-bootstrap.*       — config /ntapp-ds-bootstrap skill
#   - ds-build.*           — config /ntapp-ds-build-component skill
#   - hooks.*              — pre-commit + CI integration
#   - ds-rules-overrides   — pointer tới repo-specific rules file
# =============================================================================


# =============================================================================
# bmad: paths cho toàn bộ NTAPP ecosystem
# =============================================================================
# IMPORTANT: file `.bmm-config.yaml` này nằm ở **code repo root** (vd: bms-pmt-app/).
# Skill ds-bootstrap + ds-build-component ĐỌC config này từ code repo, write Master DS
# về spec repo. Đảm bảo các path bên dưới resolve đúng từ code repo.
bmad:
  # === Cross-repo setup (cho NTAPP brownfield: spec repo + code repo riêng) ===

  # Spec repo location (relative từ code repo, hoặc absolute).
  # Spec repo chứa: PRD, HLD, TechSpec, Master DS metadata, proposed_ds_updates.md.
  # Code repo (cwd) chứa: Angular/React app code.
  spec_repo_root: "../business-management-system-doc"

  # Code repo location (default = cwd nếu cwd có package.json).
  # Set explicit nếu skill chạy từ folder khác.
  # code_repo_root: "."

  # === Output paths (phần lớn relative tới spec_repo_root) ===

  # Root của design system artifacts (master_token, components_metadata, archive, etc.)
  # Default: trỏ về spec repo `NTAPP-output/design-system`.
  # Skill READ + WRITE master_token.json + components_metadata.json + stack-profile.json + archive ở đây.
  # MULTI-DS (project nhiều FE repo): giá trị này là DS ROOT CỦA REPO NÀY — trỏ
  # "${spec_repo_root}/NTAPP-output/design-system/{ds_id}" theo registry.yaml
  # (xem _shared/ds-registry-schema.md + ds-resolution.md nhánh A).
  design_system_root: "${spec_repo_root}/NTAPP-output/design-system"

  # Root cho phase 1 outputs (PRD, architecture, tech-spec, etc.) — ở spec repo.
  phase_1_root: "${spec_repo_root}/NTAPP-output/phase-1"

  # Root cho feature deltas (proposed_ds_updates.md, build_report.md, ...) — ở spec repo.
  # Subfolder: {feature_deltas_root}/{feature_id}/
  feature_deltas_root: "${spec_repo_root}/NTAPP-output/design-system/feature_deltas"


# =============================================================================
