[project]
name = "vds-mcp-server"
version = "1.0.0"
description = "Model Context Protocol server for VDS Platform operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",                   # Official MCP Python SDK - Context7: /modelcontextprotocol/python-sdk
    "typer>=0.24.1",                # CLI framework
    "pydantic>=2.12.5",             # Data validation
    "pydantic-settings>=2.12.0",    # Settings management
    "vds-cli-common",
]

[project.scripts]
vds-mcp-server = "vds_mcp_server.server:main"

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_mcp_server"]

[tool.uv.sources]
vds-cli-common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.5",
]
