name: Telegram Bridge — Tier 1 CI

# Spec ref: telegram_bridge/skill_content/references/verification.md §Tier 1
# Closes:   AC-1.13 (gate-enforcing CI workflow — operator-deferred half)
# Gate:     >= 75% overall coverage (AC-1.13 / NFR-1.1), enforced via
#           --cov-fail-under=75 inside verify-tier1.sh
#
# The canonical verification entry point is:
#   telegram_bridge/scripts/verify-tier1.sh
# This workflow wraps that script so the same gate runs locally and in CI.

on:
  push:
    paths:
      - "telegram_bridge/**"
      - ".github/workflows/telegram-bridge-ci.yml"
  pull_request:
    paths:
      - "telegram_bridge/**"

# Cancel in-progress runs on the same ref so a force-push does not queue stale
# runs behind the new one.  github.event_name is included in the group key so a
# push run and a PR run on the same ref do not cancel each other.
concurrency:
  group: "telegram-bridge-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # -- Fast path-filter check ---------------------------------------------------
  # dorny/paths-filter compares changed files against the PR base (or the
  # preceding commit for push events).  If no telegram_bridge/** file changed
  # -- e.g. a PR that only touches vds_cli or scheduler_orchestrator -- the
  # expensive tier1 job is skipped entirely, saving install + pyarrow build time.
  path-changed:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      telegram: ${{ steps.filter.outputs.telegram }}
    steps:
      - name: Checkout (full depth for base-commit diff)
        # fetch-depth 0 ensures dorny can resolve the base ref for push events.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter -- telegram_bridge/**
        id: filter
        # dorny/paths-filter v3 -- outputs a boolean per named filter.
        # See: https://github.com/dorny/paths-filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            telegram:
              - "telegram_bridge/**"
              - ".github/workflows/telegram-bridge-ci.yml"

  # -- Tier 1 gate --------------------------------------------------------------
  # Runs the full unit + acceptance suite and enforces the >=75% coverage gate.
  # Mirrors the local command documented in:
  #   telegram_bridge/skill_content/references/verification.md -- Tier 1
  #
  # Pass criteria (verification.md -- Tier 1):
  #   - All tests pass (448 passed, 29 skipped as of v1.0.13)
  #   - Overall coverage >= 75% (gate is --cov-fail-under=75)
  #   - Exit code 0 from verify-tier1.sh means AC-1.13 / NFR-1.1 PASS
  tier1:
    name: "Tier 1 -- unit + acceptance (>=75% coverage)"
    runs-on: ubuntu-latest
    needs: path-changed
    # Skip when no telegram_bridge files changed to avoid unnecessary installs.
    if: needs.path-changed.outputs.telegram == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install uv -- matches the astral-sh/setup-uv@v4 convention used in
      # .github/workflows/lint-and-test.yml and chaos-smoke.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Install Python 3.14 via uv.  uv manages the interpreter directly so
      # actions/setup-python is not required alongside setup-uv.
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

      # Sync all workspace packages so telegram_bridge and every dependency
      # (including pyarrow, required by the parquet cold-rotation tests in
      # test_rotate_audit.py) are available in .venv.
      #
      # Latency note: pyarrow may take 60-120 s to build from source when
      # a pre-built wheel is unavailable for the exact Python version/platform.
      # uv's cache layer (auto-enabled by setup-uv) mitigates this on repeat
      # runs within the same workflow or runner pool.
      - name: Install workspace deps (uv sync --all-packages)
        run: uv sync --all-packages

      # Run the canonical Tier 1 entry point.
      # verify-tier1.sh resolves the venv python from WT_ROOT/.venv/bin/python,
      # so it works regardless of the GH Actions working directory.
      #
      # Exit codes (from verify-tier1.sh):
      #   0 -- all tests pass + coverage >= 75%   --> gate GREEN
      #   1 -- test failure
      #   2 -- coverage below 75% gate            --> AC-1.13 FAIL
      #
      # Output is tee'd to a file so it is uploadable as an artifact even when
      # the step fails.  GH Actions uses bash with -o pipefail by default, so
      # the pipe exit code propagates correctly (left-side failure = step failure).
      - name: "Run Tier 1 verification (>=75% coverage gate -- AC-1.13 / NFR-1.1)"
        run: |
          bash telegram_bridge/scripts/verify-tier1.sh 2>&1 | tee verify-tier1-output.txt

      # Upload the captured terminal output as a CI artifact.
      # 'if: always()' ensures this runs even when the tier1 step fails so
      # coverage details are always inspectable from the Actions UI.
      - name: Upload Tier 1 output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique artifact name per run + attempt avoids collisions on re-runs.
          name: "verify-tier1-output-${{ github.run_id }}-${{ github.run_attempt }}"
          path: verify-tier1-output.txt
          if-no-files-found: warn
