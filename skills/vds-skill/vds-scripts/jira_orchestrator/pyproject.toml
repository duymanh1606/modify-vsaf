[project]
name = "vds-jira-orchestrator"
version = "0.1.0"
description = "Jira automation CLI using atlassian-python-api (SDK-only)"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "requests>=2.32.0",
    "typer>=0.24.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "vds-cli-common",
]

[project.scripts]
vds-jira-cli = "vds_jira_orchestrator.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "responses>=0.25.3",
    "requests-mock>=1.12.1",
    "ruff>=0.14.11",
]

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_jira_orchestrator"]

[tool.uv.sources]
vds-cli-common = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "pytest>=9.0.2",
    "responses>=0.26.0",
    "requests-mock>=1.12.1",
]
