[project]
name = "vds-brd-orchestrator"
version = "0.1.0"
description = "VDS BRD coverage validation orchestrator"
requires-python = ">=3.11"
dependencies = [
    "vds-cli-common",
    "typer>=0.24.1",
    "rich>=14.3.3",
]

[project.scripts]
vds-brd = "vds_brd_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_brd_orchestrator"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.11",
]
[tool.uv]
package = true

[tool.uv.sources]
vds-cli-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["vds_brd_orchestrator", "vds_cli_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
