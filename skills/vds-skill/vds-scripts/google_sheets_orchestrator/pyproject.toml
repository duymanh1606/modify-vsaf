[project]
name = "vds-google-sheets-orchestrator"
version = "0.1.0"
description = "Google Sheets orchestrator CLI for VDS"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.1.0",
    "google-auth>=2.15.0",
    "openpyxl>=3.1.2",
    "typer>=0.24.1",
    "rich>=14.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "vds-cli-common",
]

[project.scripts]
vds-google-sheets-cli = "vds_google_sheets_orchestrator.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_google_sheets_orchestrator"]

[tool.uv.sources]
vds-cli-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
