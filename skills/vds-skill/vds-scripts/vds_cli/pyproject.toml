[project]
name = "vds-cli"
version = "4.0.0"
description = "Cross-platform VDS Platform CLI"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.1",
    "rich>=14.3.3",               # Latest: 14.3.3 (Feb 2026)
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",  # Latest: 2.12.0 (Nov 2025) - Context7: /pydantic/pydantic-settings
    "vds-bitbucket-orchestrator", # For regenerate-manifest command
    "vds-google-sheets-orchestrator",
    "vds-cli-common",             # Shared CLI infrastructure
    "sqlalchemy>=2.0",            # ecosystem report dashboard (TSK-P3-3.x)
    "pyyaml>=6.0",                # confluence_sync manifest parsing
    "httpx>=0.28",                # doctor: Ollama reachability probe
]

[project.scripts]
vds-cli = "vds_cli.cli:app"

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_cli"]
include = ["src/vds_cli/assets/**/*"]

[tool.hatch.build.targets.sdist]
include = ["src/vds_cli", "pyproject.toml", "README.md"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.11",
]

[tool.uv.sources]
vds-bitbucket-orchestrator = { workspace = true }
vds-google-sheets-orchestrator = { workspace = true }
vds-cli-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.11",
]
