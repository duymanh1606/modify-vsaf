# Redis configuration for VDS PDF Orchestrator development
# Optimized for session management and caching

# Network settings
bind 0.0.0.0
port 6379
protected-mode no

# General settings
daemonize no
pidfile /var/run/redis_6379.pid

# Logging
loglevel notice
logfile ""

# Database settings
databases 16
save 900 1
save 300 10
save 60 10000

# Memory management
maxmemory 128mb
# Least Recently Used eviction
maxmemory-policy allkeys-lru

# Persistence
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Security (development settings only - remove for production)
# requirepass your_redis_password_here  # Uncomment and set password for production

# Performance tuning for development
tcp-keepalive 300
timeout 0

# Client connection limits
maxclients 1000

# Slow log (useful for debugging)
# Log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Notification settings (optional, can be enabled for debugging)
# notify-keyspace-events "Ex"

# AOF persistence (optional - disable for faster dev performance)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory usage optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Replication (not needed for single dev instance)
# slaveof <masterip> <masterport>
# masterauth <master-password>

# Cluster mode (disabled for development)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000