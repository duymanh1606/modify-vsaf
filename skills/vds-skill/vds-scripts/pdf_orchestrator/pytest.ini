[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --max-fail=10
    --cov=vds_pdf_orchestrator
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=80
    --junitxml=test-reports/junit.xml
    --html=test-reports/report.html
    --self-contained-html

markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    container: marks tests as container tests
    slow: marks tests as slow running (timeout > 30s)
    security: marks tests as security-focused
    performance: marks tests as performance tests
    requires_docker: marks tests that require Docker
    requires_redis: marks tests that require Redis
    requires_internet: marks tests that require internet
    requires_pdf_processing: marks tests that require PDF processing tools

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

minversion = 6.0
required_plugins =
    pytest-cov
    pytest-html
    pytest-mock

[tool:coverage:run]
source = src
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */node_modules/*

branch = true
omit_covered_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError

fail_under = 80
show_missing = true
skip_covered = false

[tool:coverage:html]
directory = htmlcov
