---
# YAML Linting Configuration for VDS PDF Orchestrator
extends: default

rules:
  # Enable all default rules
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    max-spaces-after: 1
  comments:
    min-spaces-from-content: 2
  # Line length rules
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  # Empty lines
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  # Indentation
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  # Truthy values
  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
  # Document start/end
  document-start:
    present: true
  document-end:
    present: false
