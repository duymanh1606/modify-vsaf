[project]
name = "vds-diagram-generator"
version = "0.0.0"
description = "VDS monorepo diagram generation tooling"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
vds-diagrams = "vds_diagram_generator.cli:main"

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_diagram_generator"]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=9.0.1",
    "hypothesis>=6.124.0",
    "pytest-asyncio>=0.25.0",
]

