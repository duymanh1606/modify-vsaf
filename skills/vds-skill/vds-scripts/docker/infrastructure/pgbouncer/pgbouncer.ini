; =============================================================================
; VDS PgBouncer config — SESSION-mode pooling, per-database stanzas
; ADR-INF-13 / FR-15 / ecosystem-infrastructure-evolution P8 (v2.15.3)
; Pinned: edoburu/pgbouncer >= v1.24 (image v1.25.1-p0)
;
; Session mode (1:1 client:backend) preserves correctness for:
;   - DBOS LISTEN/NOTIFY (scheduler_orchestrator event bus, dispatcher loop,
;     chains, WS streams)
;   - audit_orchestrator session-scoped advisory locks
;     (state/store.py:5265,5279 — corpus-refresh coordination)
;   - asyncpg full statement_cache_size=512 (memory_orchestrator)
;   - WITH HOLD cursors, temp tables, application_name, query cancel
;   - alembic pg_try_advisory_xact_lock (tx-scoped is a strict subset of
;     what session mode permits)
;
; Future R12 escalation: per-stanza `pool_mode=transaction` override on
; memory/progress stanzas if 90-day SHOW POOLS shows sustained cl_waiting>0.
; Audit and sched stay session-mode permanently.
; =============================================================================

[databases]
; One stanza per VDS schema. `connect_query` runs ONCE per backend connection
; at startup, pinning search_path before the pool hands the backend to a client.
; (`options=` is NOT a valid per-stanza key in PgBouncer 1.24+; use `connect_query`.)
vds_audit    = host=vds-postgres port=5432 dbname=vds_platform connect_query='SET search_path TO audit_state, public' pool_size=40
vds_memory   = host=vds-postgres port=5432 dbname=vds_platform connect_query='SET search_path TO memory, public' pool_size=40
vds_progress = host=vds-postgres port=5432 dbname=vds_platform connect_query='SET search_path TO progress, public' pool_size=40
vds_sched    = host=vds-postgres port=5432 dbname=vds_platform connect_query='SET search_path TO sched, public' pool_size=40

[pgbouncer]
listen_addr        = 0.0.0.0
listen_port        = 6432
auth_type          = scram-sha-256
auth_file          = /etc/pgbouncer/userlist.txt
; auth_query runs as auth_user (NOT the connecting client). Without auth_user,
; PgBouncer attempts pg_shadow lookups using the client's own credentials —
; works only when client is superuser. Since we may add non-superuser DSNs
; later, pin auth_user to the dedicated pgbouncer_auth role (created at deploy
; time per ROLLBACK.md §P8 First-Time Deploy Prerequisites).
auth_user          = pgbouncer_auth
auth_query         = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
; FR-224.7 hardening: pin auth_query to a real DB. Without this, pgbouncer
; 1.18+ uses the *connecting* db as auth_dbname; when a client connects to
; the special `pgbouncer` admin DB (e.g. the healthcheck's `psql -d pgbouncer`),
; the lookup fails with "cannot use the reserved 'pgbouncer' database as an
; auth_dbname". `vds_memory` is one of the 4 stanzas defined above and routes
; to the underlying vds_platform DB where pg_shadow lives.
auth_dbname        = vds_memory
admin_users        = pgbouncer_admin
stats_users        = pgbouncer_stats
pool_mode          = session
max_client_conn    = 500
default_pool_size  = 40
min_pool_size      = 5
max_prepared_statements = 200
server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_idle_timeout = 600
server_lifetime    = 3600
; v2.15.12: trimmed to `extra_float_digits` only (Postgres standard parameter
; many drivers send by default — not legacy compat).
;   - `options` was added pre-P8 for clients sending DSN-URL `?options=-c
;     search_path=...` query fragments. v2.15.x retired URL-options in favor
;     of per-stanza `connect_query` pinning + per-app post-handshake SET.
;     No active code sends `options` as a startup parameter post-v2.15.10.
;   - `search_path` was added in v2.15.8 first-attempt fix when memory-api
;     used asyncpg `server_settings={"search_path": ...}` (StartupMessage
;     route). v2.15.8 robust fix replaced that with SQLAlchemy `connect`
;     event listener (post-handshake SET). The allowlist entry was retained
;     "in case other libraries use it" — removed v2.15.12 per no-legacy
;     directive. Verified zero `unsupported startup parameter` rejections
;     in PgBouncer logs pre-removal.
ignore_startup_parameters = extra_float_digits
log_pooler_errors  = 1
stats_period       = 60
