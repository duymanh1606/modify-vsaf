[project]
name = "vds-git-orchestrator"
version = "0.1.0"
description = "High-throughput git orchestrator for the VDS monorepo projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.1",
    "pyyaml>=6.0.2",
    "rich>=14.3.3",
]

[project.scripts]
vds-git-orchestrator = "vds_git_orchestrator.cli:app"

[project.optional-dependencies]
tests = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_git_orchestrator"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
