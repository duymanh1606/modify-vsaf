[project]
name = "vds-sonarqube-orchestrator"
version = "0.2.0"
description = "VDS SonarQube orchestrator for code quality scanning and issue management"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "VDS Team" }]
keywords = ["sonarqube", "code-quality", "scanning", "vds", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "python-sonarqube-api>=1.0.0",
    "typer>=0.24.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "rich>=14.3.3",
    "vds-cli-common",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
]

[project.scripts]
vds-sonarqube = "vds_sonarqube_orchestrator.cli:app"

[project.optional-dependencies]
pr = ["vds-bitbucket-orchestrator"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.12",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_sonarqube_orchestrator"]

[tool.uv]
package = true

[tool.uv.sources]
vds-cli-common = { workspace = true }
vds-bitbucket-orchestrator = { workspace = true }
vds-pdf-orchestrator = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.12",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "SIM117"]  # SIM117: nested with statements OK for test clarity

[tool.ruff.lint.isort]
known-first-party = ["vds_sonarqube_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "verification: marks tests as verification tests (require real SonarQube server)",
]

[tool.mypy]
python_version = "3.13"
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/vds_sonarqube_orchestrator"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
