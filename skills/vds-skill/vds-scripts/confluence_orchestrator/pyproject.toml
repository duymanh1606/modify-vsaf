[project]
name = "vds-confluence-orchestrator"
version = "0.1.0"
description = "Confluence automation toolkit aligned with VDS git orchestrator architecture"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=5.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.3",
    "structlog>=25.5.0",
    "typer>=0.24.1",
    "vds-cli-common",
    "vds-platform-core",  # confluence/__init__.py imports vds_platform_core.errors and .http.errors
]

[project.scripts]
vds-confluence-cli = "confluence_orchestrator.cli:app"

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.5",
    "pytest>=8.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_orchestrator"]

[tool.uv.sources]
vds-cli-common = { workspace = true }
vds-platform-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.14.5",
]
