[project]
name = "vds-bitbucket-orchestrator"
version = "0.1.0"
description = "Bitbucket automation CLI using atlassian-python-api (consistent with VDS orchestrators)"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api>=4.0.7",
    "requests>=2.32.0",
    "typer>=0.24.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "vds-cli-common",
]

[project.scripts]
vds-bitbucket-cli = "vds_bitbucket_orchestrator.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "responses>=0.25.3",
    "requests-mock>=1.12.1",
    "ruff>=0.14.11",
]

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_bitbucket_orchestrator"]

[tool.uv.sources]
vds-cli-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "requests-mock>=1.12.1",
    "responses>=0.26.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
