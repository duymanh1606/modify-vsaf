[project]
name = "vds-platform-core"
version = "0.1.0"
description = "Platform-level error hierarchy, severity registry, and logging factory for VDS"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "VDS Team" }]
dependencies = [
    "structlog>=24.4.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "stamina>=24.2",
    "httpx>=0.27",
    "alembic>=1.18.4,<2",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vds_platform_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/vds_platform_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 80
