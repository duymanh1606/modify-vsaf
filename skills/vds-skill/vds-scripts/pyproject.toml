[project]
name = "vds-scripts-workspace"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "bitbucket_orchestrator",
  "brd_orchestrator",
  "confluence_orchestrator",
  "diagram_generator",
  "elastic_orchestrator",
  "excel_orchestrator",
  "git_orchestrator",
  "google_sheets_orchestrator",
  "grafana_orchestrator",
  "jira_orchestrator",
  "jira_viettelmoney_orchestrator",
  "markdown_orchestrator",
  "mcp_server",
  "pdf_orchestrator",
  "sonarqube_orchestrator",
  "platform_core",
  "vds_agent_core",
  "vds_cli",
  "vds_cli_common",
  "vidp_orchestrator",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
line-length = 120
target-version = "py314"
# Exclude intentional non-compliant fixture files
exclude = [
    "**/tests/fixtures/python-noncompliant/**",
    "**/.openspace/**",
]

# Phase 3: Unified workspace lint config — supersedes per-package ruff sections
# where packages have the same rules. Packages may still override with local
# [tool.ruff] for special cases.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # Pylint
    "RUF", # Ruff-specific
]
ignore = [
    "E501",      # Line too long (formatter handles this)
    "PLR0913",   # Too many arguments
    "PLR2004",   # Magic value comparison
    "PLC0415",   # Allow lazy imports
    "ARG002",    # Allow unused args in interfaces
    "TC003",     # Allow runtime typing imports
    "RUF001",    # Allow Unicode symbols
    "SIM117",    # Allow nested with statements
    "B008",      # Typer/FastAPI idiomatic DI defaults
]

[tool.ruff.lint.per-file-ignores]
# Test files intentionally use non-standard patterns
"*/tests/**" = [
    "ARG001", "ARG003", "ARG005", "B904",
    "E402",   # module-level import at non-top
    "F401",   # unused import
    "F811",   # redefinition of unused
    "SIM102",  # nested if
]
# B904 in CLI files is typically typer.BadParameter/typer.Exit — not chain-worthy
"elastic_orchestrator/src/vds_elastic_orchestrator/cli.py" = ["B904"]
"grafana_orchestrator/src/vds_grafana_orchestrator/cli.py" = ["B904"]
"sonarqube_orchestrator/src/vds_sonarqube_orchestrator/cli.py" = ["B904"]
# PDF orchestrator ruff_rules.py is a self-test utility, not production code
"pdf_orchestrator/.ruff_rules.py" = ["SIM102"]
# Temp scripts are not production code
"scripts/generate_completion_report.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = [
    "vds_cli",
    "vds_cli_common",
    "vds_platform_core",
    "vds_agent_core",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Phase 3: Workspace mypy config — packages opt-in by not overriding
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disable_error_code = ["prop-decorator"]
show_error_codes = true
pretty = true
warn_unused_ignores = true

# Phase 3: import-linter layered dependency contract
[tool.importlinter]
root_package = "vds_cli"

[[tool.importlinter.contracts]]
name = "CLI layer ordering"
type = "layers"
containers = [
    "vds_cli",
    "vds_cli_common",
    "vds_platform_core",
]

[[tool.importlinter.contracts]]
name = "agent-core-isolation"
type = "forbidden"
source_modules = ["vds_agent_core"]
forbidden_modules = []

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "import-linter>=2.11",
    "psycopg2-binary>=2.9.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "sqlalchemy>=2.0.49",
    "testcontainers[postgres]>=4",
]
